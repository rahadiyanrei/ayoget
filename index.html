<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm Game - Audition Style</title>
    <style>
        /* ============================================================
           RESET & BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        /* ============================================================
           LAYOUT CONTAINER - Centered, Fixed Proportions
           ============================================================ */
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .gameplay-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            position: relative;
        }

        /* ============================================================
           HUD - Top Left & Right
           ============================================================ */
        .hud {
            position: fixed;
            top: 20px;
            width: calc(100% - 40px);
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .hud-left, .hud-right {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 8px;
            border: 2px solid #4a9eff;
            min-width: 200px;
        }

        .hud-item {
            margin-bottom: 8px;
            font-size: 14px;
        }

        .hud-item:last-child {
            margin-bottom: 0;
        }

        .hud-label {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
        }

        .hud-value {
            font-size: 24px;
            font-weight: bold;
            color: #4a9eff;
        }

        .hud-value.score {
            color: #ffd700;
        }

        .hud-value.combo {
            color: #ff6b6b;
        }

        /* ============================================================
           BEAT GAUGE
           ============================================================ */
        .beat-gauge-container {
            width: 480px;
            height: 20px;
            background: linear-gradient(90deg, #2a2a4a 0%, #3a3a5a 50%, #2a2a4a 100%);
            border-radius: 10px;
            border: 3px solid #4a9eff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(74, 158, 255, 0.5);
        }

        .beat-gauge-track {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                rgba(74, 158, 255, 0.2) 0%, 
                rgba(74, 158, 255, 0.4) 25%,
                rgba(74, 158, 255, 0.6) 50%,
                rgba(74, 158, 255, 0.8) 75%,
                rgba(74, 158, 255, 1) 100%);
            opacity: 0.3;
        }

        .beat-gauge-ball {
            position: absolute;
            top: 2px;
            left: 0;
            width: 16px;
            height: 16px;
            background: radial-gradient(circle, #fff 0%, #4a9eff 50%, #2a5a9a 100%);
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 10px rgba(74, 158, 255, 0.8);
            transform: translateX(-50%);
            transition: none; /* Linear movement handled by JS */
        }

        .perfect-zone-marker {
            position: absolute;
            top: 0;
            height: 100%;
            background: rgba(255, 215, 0, 0.3);
            border-left: 2px solid rgba(255, 215, 0, 0.6);
            border-right: 2px solid rgba(255, 215, 0, 0.6);
            pointer-events: none;
        }

        /* ============================================================
           ARROW PANEL
           ============================================================ */
        .arrow-panel {
            display: flex;
            gap: 10px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            border: 3px solid #4a9eff;
            box-shadow: 0 0 30px rgba(74, 158, 255, 0.4);
        }

        .arrow-slot {
            width: 60px;
            height: 60px;
            background: linear-gradient(180deg, #2a2a4a 0%, #1a1a2e 100%);
            border-radius: 10px;
            border: 3px solid #3a3a5a;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .arrow-slot.active {
            border-color: #4a9eff;
            box-shadow: 0 0 15px rgba(74, 158, 255, 0.6);
        }

        .arrow-slot.hit {
            background: linear-gradient(180deg, #4a9eff 0%, #2a5a9a 100%);
            border-color: #fff;
        }

        .arrow-slot.miss {
            background: linear-gradient(180deg, #ff4a4a 0%, #9a2a2a 100%);
            border-color: #ff6b6b;
        }

        .arrow-icon {
            font-size: 32px;
            color: #666;
            transition: all 0.1s ease;
        }

        .arrow-slot.active .arrow-icon,
        .arrow-slot.hit .arrow-icon {
            color: #fff;
            transform: scale(1.1);
        }

        .arrow-slot.miss .arrow-icon {
            color: #ffcccc;
        }

        /* Space button indicator */
        .space-indicator {
            width: 100%;
            height: 40px;
            background: linear-gradient(180deg, #2a2a4a 0%, #1a1a2e 100%);
            border-radius: 8px;
            border: 3px solid #3a3a5a;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            font-weight: bold;
            font-size: 18px;
            color: #666;
            transition: all 0.1s ease;
        }

        .space-indicator.ready {
            background: linear-gradient(180deg, #ffd700 0%, #b8860b 100%);
            border-color: #fff;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        .space-indicator.pressed {
            background: linear-gradient(180deg, #fff 0%, #ccc 100%);
            transform: scale(0.95);
        }

        /* ============================================================
           JUDGE TEXT & COMBO
           ============================================================ */
        .judge-display {
            text-align: center;
            min-height: 80px;
        }

        .judge-text {
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 20px currentColor;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.1s ease;
        }

        .judge-text.show {
            opacity: 1;
            transform: scale(1);
        }

        .judge-text.perfect { color: #ffd700; }
        .judge-text.great { color: #4a9eff; }
        .judge-text.cool { color: #9b59b6; }
        .judge-text.miss { color: #ff4a4a; }

        .combo-display {
            font-size: 36px;
            font-weight: bold;
            color: #ff6b6b;
            text-shadow: 0 0 15px rgba(255, 107, 107, 0.6);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.2s ease;
        }

        .combo-display.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* ============================================================
           MENU / LOADING SCREEN
           ============================================================ */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .menu-overlay.hidden {
            display: none;
        }

        .menu-content {
            text-align: center;
            max-width: 500px;
            padding: 40px;
            background: rgba(26, 26, 46, 0.95);
            border-radius: 20px;
            border: 3px solid #4a9eff;
        }

        .menu-title {
            font-size: 36px;
            margin-bottom: 30px;
            color: #4a9eff;
            text-shadow: 0 0 20px rgba(74, 158, 255, 0.6);
        }

        .menu-section {
            margin-bottom: 25px;
        }

        .menu-label {
            font-size: 16px;
            color: #888;
            margin-bottom: 10px;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .btn {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(180deg, #4a9eff 0%, #2a5a9a 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(74, 158, 255, 0.6);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-start {
            background: linear-gradient(180deg, #ffd700 0%, #b8860b 100%);
            color: #000;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(180deg, #4a9eff 0%, #2a5a9a 100%);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            margin-left: 5px;
        }

        .btn-small:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(74, 158, 255, 0.6);
        }

        .btn-small.btn-reset {
            background: linear-gradient(180deg, #ff6b6b 0%, #c0392b 100%);
        }

        .bpm-correction-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .bpm-label {
            font-size: 14px;
            color: #888;
        }

        .bpm-value {
            font-size: 18px;
            color: #4a9eff;
            font-weight: bold;
            min-width: 60px;
            text-align: center;
        }

        .bpm-input {
            width: 100px;
            padding: 8px;
            font-size: 16px;
            border: 2px solid #4a9eff;
            border-radius: 6px;
            background: #1a1a2e;
            color: #fff;
            text-align: center;
        }

        .bpm-input:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .song-info {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .song-name {
            font-size: 18px;
            color: #4a9eff;
            margin-bottom: 5px;
        }

        .song-status {
            font-size: 14px;
            color: #888;
        }

        .loading-bar {
            width: 100%;
            height: 8px;
            background: #2a2a4a;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #4a9eff, #ffd700);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* ============================================================
           DEBUG PANEL
           ============================================================ */
        .debug-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #4a4a6a;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            min-width: 250px;
            z-index: 100;
        }

        .debug-panel h3 {
            color: #4a9eff;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .debug-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .debug-label {
            color: #888;
        }

        .debug-value {
            color: #4a9eff;
            font-weight: bold;
        }

        /* ============================================================
           UTILITIES
           ============================================================ */
        .hidden {
            display: none !important;
        }

        .fade-in {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- ============================================================
         MENU OVERLAY
         ============================================================ -->
    <div id="menuOverlay" class="menu-overlay">
        <div class="menu-content">
            <h1 class="menu-title">🎵 Rhythm Game</h1>
            
            <div class="menu-section">
                <div class="menu-label">Step 1: Load Song (MP3/WAV)</div>
                <div class="file-input-wrapper">
                    <button class="btn" id="loadSongBtn">📁 Choose File</button>
                    <input type="file" id="songInput" accept=".mp3,.wav,audio/mpeg,audio/wav">
                </div>
                <div id="songInfo" class="song-info hidden">
                    <div class="song-name" id="songNameDisplay">-</div>
                    <div class="song-status" id="songStatus">Waiting...</div>
                    <div class="loading-bar">
                        <div class="loading-progress" id="loadingProgress"></div>
                    </div>
                </div>
            </div>

            <div class="menu-section">
                <div class="menu-label">Step 2: Start Game</div>
                <button class="btn btn-start" id="startGameBtn" disabled>▶ Start Game</button>
            </div>

            <div class="menu-section bpm-correction hidden" id="bpmCorrectionSection">
                <div class="menu-label">BPM Correction</div>
                <div class="bpm-correction-controls">
                    <span class="bpm-label">Detected:</span>

                    <span class="bpm-label">Corrected:</span>
                    <input type="number" id="manualBpmInput" class="bpm-input" step="0.01" min="40" max="300" placeholder="Enter BPM">
                    <button class="btn btn-small" id="applyBpmBtn">Apply</button>
                    <button class="btn btn-small btn-reset" id="resetBpmBtn">Reset</button>
                </div>
            </div>

            <div class="menu-section">
                <div class="menu-label">
                    <label>
                        <input type="checkbox" id="aiPlayerToggle"> Enable AI Player
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================================
         GAME CONTAINER
         ============================================================ -->
    <div class="game-container">
        <!-- HUD -->
        <div class="hud">
            <div class="hud-left">
                <div class="hud-item">
                    <div class="hud-label">Score</div>
                    <div class="hud-value score" id="scoreDisplay">0</div>
                </div>
                <div class="hud-item">
                    <div class="hud-label">Combo</div>
                    <div class="hud-value combo" id="comboDisplay">0</div>
                </div>
                <div class="hud-item">
                    <div class="hud-label">Accuracy</div>
                    <div class="hud-value" id="accuracyDisplay">100%</div>

                <div class="hud-item">

        <!-- Gameplay Area -->
        <div class="gameplay-area">
            <!-- Beat Gauge -->
            <div class="beat-gauge-container" id="beatGauge">

                <div class="perfect-zone-marker" id="perfectZoneMarker"></div>

            <!-- Arrow Panel -->
            <div class="arrow-panel">

    <!-- ============================================================
         DEBUG PANEL
         ============================================================ -->

        <div class="debug-row">
            <span class="debug-label">Time:</span>

        <div class="debug-row">

        <div class="debug-row">
            <span class="debug-label">Beat Count:</span>
            <span class="debug-value" id="dbgBeatCount">0</span>
        </div>
    </div>

    <!-- ============================================================
         JAVASCRIPT
         ============================================================ -->
    <script>
        // ============================================================
        // GAME CONSTANTS
        // ============================================================
        class GameConstants {
            // Judge Windows (as ratio of gauge 0-1)
            static JUDGE_WINDOWS = {
                PERFECT: { min: 0.73, max: 0.77 },
                GREAT: [
                    { min: 0.69, max: 0.73 },
                    { min: 0.77, max: 0.81 }
                ],
                COOL: [
                    { min: 0.65, max: 0.69 },
                    { min: 0.81, max: 0.85 }
                ]
            };

            // Scoring
            static SCORES = {
                PERFECT: 100,
                GREAT: 50,
                COOL: 25,
                MISS: 0
            };

            // Gauge dimensions
            static GAUGE_WIDTH = 480;
            static GAUGE_HEIGHT = 20;

            // Pattern settings
            static MIN_PATTERN_LENGTH = 4;
            static MAX_PATTERN_LENGTH = 9;

            // Arrow directions
            static ARROWS = ['left', 'up', 'down', 'right'];
            static ARROW_KEYS = {
                'ArrowLeft': 'left',
                'ArrowUp': 'up',
                'ArrowDown': 'down',
                'ArrowRight': 'right'
            };

            // Game states
            static STATE = {
                MENU: 'MENU',
                LOADING: 'LOADING',
                ANALYZING: 'ANALYZING',
                READY: 'READY',
                PLAYING: 'PLAYING',
                PAUSED: 'PAUSED',
                ENDED: 'ENDED'
            };

            // Timing (milliseconds for reference, but we use audio time)
            static AUDIO_SYNC_THRESHOLD = 0.01; // 10ms tolerance
        }

        // ============================================================
        // AUDIO ENGINE
        // ============================================================
        class AudioEngine {
            constructor() {
                this.audioContext = null;
                this.audioBuffer = null;
                this.sourceNode = null;
                this.gainNode = null;
                this.isPlaying = false;
                this.startTime = 0;
                this.pauseTime = 0;
            }

            async init() {
                if (!this.audioContext) {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    this.gainNode = this.audioContext.createGain();
                    this.gainNode.connect(this.audioContext.destination);
                }
                if (this.audioContext.state === 'suspended') {
                    await this.audioContext.resume();
                }
            }

            async loadFile(file, onProgress) {
                await this.init();
                
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    
                    reader.onprogress = (e) => {
                        if (e.lengthComputable && onProgress) {
                            const percent = (e.loaded / e.total) * 100;
                            onProgress(percent);
                        }
                    };

                    reader.onload = async (e) => {
                        try {
                            const arrayBuffer = e.target.result;
                            this.audioBuffer = await this.audioContext.decodeAudioData(arrayBuffer);
                            resolve(this.audioBuffer);
                        } catch (error) {
                            reject(new Error('Failed to decode audio: ' + error.message));
                        }
                    };

                    reader.onerror = () => {
                        reject(new Error('Failed to read file'));
                    };

                    reader.readAsArrayBuffer(file);
                });
            }

            play() {
                if (!this.audioBuffer || !this.audioContext) return false;
                
                this.sourceNode = this.audioContext.createBufferSource();
                this.sourceNode.buffer = this.audioBuffer;
                this.sourceNode.connect(this.gainNode);
                
                this.startTime = this.audioContext.currentTime - this.pauseTime;
                this.sourceNode.start(0, this.pauseTime);
                this.isPlaying = true;
                
                this.sourceNode.onended = () => {
                    if (this.isPlaying && this.getCurrentTime() >= this.getDuration()) {
                        this.isPlaying = false;
                    }
                };

                return true;
            }

            pause() {
                if (!this.isPlaying || !this.sourceNode) return;
                
                this.pauseTime = this.getCurrentTime();
                this.sourceNode.stop();
                this.sourceNode = null;
                this.isPlaying = false;
            }

            stop() {
                this.pause();
                this.pauseTime = 0;
            }

            seekTo(time) {
                if (!this.audioBuffer || !this.audioContext) return;
                
                const wasPlaying = this.isPlaying;
                
                // Stop current playback
                if (this.isPlaying && this.sourceNode) {
                    this.sourceNode.stop();
                    this.sourceNode = null;
                    this.isPlaying = false;
                }
                
                // Set pause time to the seek position
                this.pauseTime = Math.max(0, Math.min(time, this.getDuration()));
                
                // Resume if was playing
                if (wasPlaying) {
                    this.play();
                }
            }

            getCurrentTime() {
                if (!this.audioContext || !this.isPlaying) return this.pauseTime;
                return this.audioContext.currentTime - this.startTime;
            }

            getDuration() {
                return this.audioBuffer ? this.audioBuffer.duration : 0;
            }

            getPlaybackRate() {
                return this.sourceNode ? this.sourceNode.playbackRate.value : 1;
            }
        }

        // ============================================================
        // BEAT DETECTOR
        // ============================================================
        class BeatDetector {
            constructor(audioEngine) {
                this.audioEngine = audioEngine;
            }

            async detectBeats(onProgress) {
                const buffer = this.audioEngine.audioBuffer;
                if (!buffer) return { beats: [], bpm: 0 };

                // Use both channels, downmix to mono for analysis
                const channelData = buffer.getChannelData(0);
                const sampleRate = buffer.sampleRate;
                const duration = buffer.duration;

                // Progress callback
                const reportProgress = (percent) => {
                    if (onProgress) onProgress(percent);
                };

                reportProgress(10);

                // Energy-based beat detection with flux calculation
                const windowSize = 2048;
                const hopSize = 512;
                const numWindows = Math.floor((channelData.length - windowSize) / hopSize);

                reportProgress(20);

                // Calculate spectral flux
                const flux = [];
                let previousSpectrum = new Float32Array(windowSize / 2);

                for (let i = 0; i < numWindows; i++) {
                    const start = i * hopSize;
                    const window = channelData.slice(start, start + windowSize);
                    
                    // Apply Hanning window
                    for (let j = 0; j < windowSize; j++) {
                        window[j] *= 0.5 * (1 - Math.cos(2 * Math.PI * j / (windowSize - 1)));
                    }

                    // Simple FFT approximation using zero-crossing and energy
                    let energy = 0;
                    let zeroCrossings = 0;
                    for (let j = 0; j < windowSize - 1; j++) {
                        energy += window[j] * window[j];
                        if ((window[j] >= 0 && window[j + 1] < 0) || 
                            (window[j] < 0 && window[j + 1] >= 0)) {
                            zeroCrossings++;
                        }
                    }

                    // Low-frequency emphasis (simple high-pass removal)
                    const lowEnergy = this.calculateLowFrequencyEnergy(window, sampleRate);
                    
                    flux.push({
                        time: start / sampleRate,
                        energy: energy / windowSize,
                        lowEnergy: lowEnergy,
                        zeroCrossings: zeroCrossings
                    });

                    if (i % 100 === 0) {
                        reportProgress(20 + (i / numWindows) * 40);
                    }
                }

                reportProgress(65);

                // Normalize and find peaks
                const maxEnergy = Math.max(...flux.map(f => f.lowEnergy));
                flux.forEach(f => f.normalizedEnergy = f.lowEnergy / (maxEnergy || 1));

                // Adaptive threshold for peak detection
                const threshold = this.calculateAdaptiveThreshold(flux.map(f => f.normalizedEnergy));
                
                const peaks = [];
                const minPeakDistance = 0.2; // Minimum 200ms between beats (300 BPM max)

                for (let i = 1; i < flux.length - 1; i++) {
                    if (flux[i].normalizedEnergy > threshold &&
                        flux[i].normalizedEnergy > flux[i - 1].normalizedEnergy &&
                        flux[i].normalizedEnergy > flux[i + 1].normalizedEnergy) {
                        
                        // Check minimum distance from last peak
                        if (peaks.length === 0 || 
                            flux[i].time - peaks[peaks.length - 1] >= minPeakDistance) {
                            peaks.push(flux[i].time);
                        }
                    }
                }

                reportProgress(80);

                // Estimate BPM from peak intervals
                const bpm = this.estimateBPM(peaks);
                
                // Refine beats to match estimated BPM grid
                const refinedBeats = this.refineToGrid(peaks, bpm);

                reportProgress(95);

                // Sort and filter beats within song duration
                const beats = refinedBeats
                    .filter(t => t >= 0 && t <= duration)
                    .sort((a, b) => a - b);

                reportProgress(100);

                return { beats, bpm };
            }

            calculateLowFrequencyEnergy(samples, sampleRate) {
                // Simple low-frequency energy estimation
                // Count samples that contribute to bass frequencies
                let energy = 0;
                const blockSize = Math.floor(sampleRate / 100); // ~100Hz blocks
                
                for (let i = 0; i < samples.length; i += blockSize) {
                    let blockSum = 0;
                    for (let j = 0; j < blockSize && i + j < samples.length; j++) {
                        blockSum += Math.abs(samples[i + j]);
                    }
                    // Weight lower blocks more heavily
                    const weight = 1 / (1 + i / samples.length);
                    energy += blockSum * weight;
                }
                
                return energy;
            }

            calculateAdaptiveThreshold(values) {
                const sorted = [...values].sort((a, b) => a - b);
                const percentile75 = sorted[Math.floor(sorted.length * 0.75)];
                const percentile25 = sorted[Math.floor(sorted.length * 0.25)];
                const iqr = percentile75 - percentile25;
                return percentile75 + 0.5 * iqr;
            }

            estimateBPM(peaks) {
                if (peaks.length < 2) return 120; // Default BPM

                const intervals = [];
                for (let i = 1; i < Math.min(peaks.length, 50); i++) {
                    intervals.push(peaks[i] - peaks[i - 1]);
                }

                // Find median interval
                const sortedIntervals = intervals.sort((a, b) => a - b);
                const medianInterval = sortedIntervals[Math.floor(sortedIntervals.length / 2)];

                if (medianInterval <= 0) return 120;

                let bpm = 60 / medianInterval;

                // Adjust to common BPM ranges (quantize to typical values)
                const commonBPMs = [80, 90, 100, 110, 120, 128, 130, 140, 150, 160, 170, 180];
                let closestBPM = commonBPMs.reduce((prev, curr) => 
                    Math.abs(curr - bpm) < Math.abs(prev - bpm) ? curr : prev
                );

                return closestBPM;
            }

            refineToGrid(peaks, bpm) {
                if (peaks.length === 0 || bpm <= 0) return peaks;

                const beatInterval = 60 / bpm;
                const measureInterval = beatInterval * 4;

                // Find the first strong beat as reference
                let referenceTime = peaks[0];
                
                // Create a grid based on BPM
                const gridBeats = [];
                const startTime = Math.max(0, referenceTime - beatInterval * 2);
                const endTime = referenceTime + beatInterval * (peaks.length + 2);

                for (let t = startTime; t < endTime; t += beatInterval) {
                    // Snap to nearest peak if within tolerance
                    const tolerance = beatInterval * 0.15;
                    const nearestPeak = peaks.find(p => Math.abs(p - t) < tolerance);
                    gridBeats.push(nearestPeak !== undefined ? nearestPeak : t);
                }

                return gridBeats;
            }
        }

        // ============================================================
        // BEAT ENGINE
        // ============================================================
        class BeatEngine {
            constructor() {
                this.beats = [];
                this.bpm = 0;
                this.currentBeatIndex = 0;
                this.measureDuration = 0;
                
                // Manual BPM correction
                this.manualBPM = null;
                this.bpmCorrectionEnabled = false;
            }

            setBeats(beats, detectedBPM) {
                this.beats = beats;
                this.bpm = detectedBPM;
                this.currentBeatIndex = 0;
                this.manualBPM = null;
                this.bpmCorrectionEnabled = false;
                
                this.updateMeasureDuration();
                console.log(`BeatEngine: Loaded ${beats.length} beats at ${detectedBPM.toFixed(2)} BPM`);
            }

            enableManualBPM(bpm) {
                this.manualBPM = bpm;
                this.bpmCorrectionEnabled = true;
                this.updateMeasureDuration();
                this.regenerateBeatTimeline();
                console.log(`BeatEngine: Manual BPM enabled at ${bpm.toFixed(2)} BPM`);
            }

            disableManualBPM() {
                this.manualBPM = null;
                this.bpmCorrectionEnabled = false;
                this.updateMeasureDuration();
                this.regenerateBeatTimeline();
                console.log(`BeatEngine: Manual BPM disabled, using detected BPM`);
            }

            getEffectiveBPM() {
                return this.bpmCorrectionEnabled ? this.manualBPM : this.bpm;
            }

            updateMeasureDuration() {
                const effectiveBPM = this.getEffectiveBPM();
                if (effectiveBPM > 0) {
                    const beatDuration = 60 / effectiveBPM;
                    this.measureDuration = beatDuration * 4;
                } else {
                    this.measureDuration = 0;
                }
            }

            regenerateBeatTimeline() {
                if (this.beats.length === 0) return;
                
                const effectiveBPM = this.getEffectiveBPM();
                const beatInterval = 60 / effectiveBPM;
                
                // Regenerate beats based on the first beat and new BPM
                const firstBeatTime = this.beats[0];
                const newBeats = [firstBeatTime];
                
                for (let i = 1; i < this.beats.length; i++) {
                    newBeats.push(firstBeatTime + (i * beatInterval));
                }
                
                this.beats = newBeats;
                console.log(`BeatEngine: Regenerated ${newBeats.length} beats at ${effectiveBPM.toFixed(2)} BPM`);
            }

            getCurrentBeatIndex(currentTime) {
                // Find which beat we're currently at or past
                for (let i = this.beats.length - 1; i >= 0; i--) {
                    if (currentTime >= this.beats[i]) {
                        return i;
                    }
                }
                return -1;
            }

            getNextBeatIndex(currentTime) {
                // Find the next upcoming beat
                for (let i = 0; i < this.beats.length; i++) {
                    if (this.beats[i] > currentTime) {
                        return i;
                    }
                }
                return -1;
            }

            getCurrentMeasure(currentTime) {
                if (this.measureDuration <= 0) return 0;
                return Math.floor(currentTime / this.measureDuration);
            }

            getBeatInMeasure(currentTime) {
                if (this.measureDuration <= 0) return 0;
                const timeInMeasure = currentTime % this.measureDuration;
                if (this.bpm <= 0) return 0;
                const beatDuration = 60 / this.bpm;
                return Math.floor(timeInMeasure / beatDuration);
            }

            getTotalBeats() {
                return this.beats.length;
            }

            isReady() {
                return this.beats.length > 0 && this.bpm > 0;
            }
        }

        // ============================================================
        // TIMING ENGINE - Source of Truth for All Timing
        // ============================================================
        class TimingEngine {
            constructor(audioEngine, beatEngine) {
                this.audioEngine = audioEngine;
                this.beatEngine = beatEngine;
            }

            getCurrentTime() {
                return this.audioEngine.getCurrentTime();
            }

            getGaugePosition() {
                // Returns position as ratio 0-1 within current measure
                const currentTime = this.getCurrentTime();
                const measureDuration = this.beatEngine.measureDuration;
                
                if (measureDuration <= 0) return 0;
                
                const timeInMeasure = currentTime % measureDuration;
                return timeInMeasure / measureDuration;
            }

            isInJudgeWindow(judgeType) {
                const position = this.getGaugePosition();
                const windows = GameConstants.JUDGE_WINDOWS;

                switch (judgeType) {
                    case 'PERFECT':
                        return position >= windows.PERFECT.min && position <= windows.PERFECT.max;
                    
                    case 'GREAT':
                        return windows.GREAT.some(range => 
                            position >= range.min && position <= range.max
                        );
                    
                    case 'COOL':
                        return windows.COOL.some(range => 
                            position >= range.min && position <= range.max
                        );
                    
                    default:
                        return false;
                }
            }

            getJudgeResult() {
                const position = this.getGaugePosition();
                const windows = GameConstants.JUDGE_WINDOWS;

                // Check PERFECT first (highest priority)
                if (position >= windows.PERFECT.min && position <= windows.PERFECT.max) {
                    return 'PERFECT';
                }

                // Check GREAT
                for (const range of windows.GREAT) {
                    if (position >= range.min && position <= range.max) {
                        return 'GREAT';
                    }
                }

                // Check COOL
                for (const range of windows.COOL) {
                    if (position >= range.min && position <= range.max) {
                        return 'COOL';
                    }
                }

                // Outside all windows = MISS (if space was pressed)
                return 'MISS';
            }

            getCurrentBeat() {
                return this.beatEngine.getCurrentBeatIndex(this.getCurrentTime());
            }

            getCurrentMeasure() {
                return this.beatEngine.getCurrentMeasure(this.getCurrentTime());
            }

            getBeatInMeasure() {
                return this.beatEngine.getBeatInMeasure(this.getCurrentTime());
            }

            isSongPlaying() {
                return this.audioEngine.isPlaying;
            }

            getSongDuration() {
                return this.audioEngine.getDuration();
            }

            isSongEnded() {
                return this.getCurrentTime() >= this.getSongDuration();
            }
        }

        // ============================================================
        // PATTERN GENERATOR
        // ============================================================
        class PatternGenerator {
            constructor() {
                this.arrows = GameConstants.ARROWS;
                this.lastPattern = [];
            }

            generate(length) {
                if (length < GameConstants.MIN_PATTERN_LENGTH) {
                    length = GameConstants.MIN_PATTERN_LENGTH;
                }
                if (length > GameConstants.MAX_PATTERN_LENGTH) {
                    length = GameConstants.MAX_PATTERN_LENGTH;
                }

                const pattern = [];
                let lastArrow = null;
                let secondLastArrow = null;

                for (let i = 0; i < length; i++) {
                    let availableArrows = [...this.arrows];

                    // Avoid immediate repetition
                    if (lastArrow) {
                        availableArrows = availableArrows.filter(a => a !== lastArrow);
                    }

                    // Avoid easy patterns like alternating same two arrows
                    if (secondLastArrow && lastArrow && availableArrows.length > 1) {
                        const wouldAlternate = availableArrows.find(a => 
                            a === secondLastArrow
                        );
                        if (wouldAlternate && availableArrows.length > 2) {
                            availableArrows = availableArrows.filter(a => a !== secondLastArrow);
                        }
                    }

                    // Random selection from available
                    const selectedIndex = Math.floor(Math.random() * availableArrows.length);
                    const selectedArrow = availableArrows[selectedIndex];

                    pattern.push(selectedArrow);
                    secondLastArrow = lastArrow;
                    lastArrow = selectedArrow;
                }

                this.lastPattern = pattern;
                return pattern;
            }

            getRandomLength() {
                return Math.floor(
                    Math.random() * (GameConstants.MAX_PATTERN_LENGTH - GameConstants.MIN_PATTERN_LENGTH + 1)
                ) + GameConstants.MIN_PATTERN_LENGTH;
            }
        }

        // ============================================================
        // ARROW ENGINE
        // ============================================================
        class ArrowEngine {
            constructor(patternGenerator) {
                this.patternGenerator = patternGenerator;
                this.currentPattern = [];
                this.currentIndex = 0;
                this.isSequenceComplete = false;
                this.isWaitingForSpace = false;
                this.patternLength = 0;
                
                // Callbacks
                this.onPatternStart = null;
                this.onArrowHit = null;
                this.onArrowMiss = null;
                this.onSequenceComplete = null;
                this.onReset = null;
            }

            startNewPattern() {
                this.patternLength = this.patternGenerator.getRandomLength();
                this.currentPattern = this.patternGenerator.generate(this.patternLength);
                this.currentIndex = 0;
                this.isSequenceComplete = false;
                this.isWaitingForSpace = false;

                if (this.onPatternStart) {
                    this.onPatternStart(this.currentPattern);
                }

                return this.currentPattern;
            }

            handleArrowInput(direction) {
                if (this.isWaitingForSpace) {
                    // Already completed sequence, waiting for space
                    return { result: 'IGNORED', message: 'Waiting for SPACE' };
                }

                if (this.currentPattern.length === 0) {
                    return { result: 'ERROR', message: 'No active pattern' };
                }

                const expectedArrow = this.currentPattern[this.currentIndex];

                if (direction === expectedArrow) {
                    // Correct arrow
                    this.currentIndex++;

                    if (this.currentIndex >= this.currentPattern.length) {
                        // Sequence complete
                        this.isSequenceComplete = true;
                        this.isWaitingForSpace = true;

                        if (this.onSequenceComplete) {
                            this.onSequenceComplete();
                        }

                        return { result: 'COMPLETE', message: 'Sequence complete, press SPACE' };
                    }

                    if (this.onArrowHit) {
                        this.onArrowHit(this.currentIndex, this.currentPattern.length);
                    }

                    return { result: 'HIT', message: `Arrow ${this.currentIndex}/${this.currentPattern.length}` };
                } else {
                    // Wrong arrow - reset sequence
                    this.reset();

                    if (this.onArrowMiss) {
                        this.onArrowMiss(direction, expectedArrow);
                    }

                    return { result: 'MISS', message: 'Wrong arrow! Sequence reset.' };
                }
            }

            handleSpaceInput() {
                if (!this.isWaitingForSpace) {
                    return { result: 'TOO_EARLY', message: 'Complete the sequence first' };
                }

                // Space pressed - timing will be evaluated by JudgeEngine
                return { result: 'SPACE_PRESSED', message: 'Space pressed, checking timing...' };
            }

            reset() {
                const oldPattern = [...this.currentPattern];
                this.currentIndex = 0;
                this.isSequenceComplete = false;
                this.isWaitingForSpace = false;

                if (this.onReset) {
                    this.onReset(oldPattern);
                }
            }

            getCurrentProgress() {
                return {
                    current: this.currentIndex,
                    total: this.currentPattern.length,
                    isComplete: this.isSequenceComplete,
                    isWaitingForSpace: this.isWaitingForSpace
                };
            }

            getCurrentPattern() {
                return this.currentPattern;
            }
        }

        // ============================================================
        // JUDGE ENGINE
        // ============================================================
        class JudgeEngine {
            constructor(timingEngine) {
                this.timingEngine = timingEngine;
                this.score = 0;
                this.combo = 0;
                this.maxCombo = 0;
                this.totalJudgments = 0;
                this.perfectCount = 0;
                this.greatCount = 0;
                this.coolCount = 0;
                this.missCount = 0;

                // Callbacks
                this.onJudge = null;
                this.onComboUpdate = null;
                this.onScoreUpdate = null;
            }

            judgeSpacePress() {
                const result = this.timingEngine.getJudgeResult();
                this.totalJudgments++;

                switch (result) {
                    case 'PERFECT':
                        this.score += GameConstants.SCORES.PERFECT;
                        this.combo++;
                        this.perfectCount++;
                        break;

                    case 'GREAT':
                        this.score += GameConstants.SCORES.GREAT;
                        this.combo++;
                        this.greatCount++;
                        break;

                    case 'COOL':
                        this.score += GameConstants.SCORES.COOL;
                        this.combo++;
                        this.coolCount++;
                        break;

                    case 'MISS':
                    default:
                        this.score += GameConstants.SCORES.MISS;
                        this.combo = 0;
                        this.missCount++;
                        break;
                }

                if (this.combo > this.maxCombo) {
                    this.maxCombo = this.combo;
                }

                if (this.onJudge) {
                    this.onJudge(result);
                }

                if (this.onComboUpdate) {
                    this.onComboUpdate(this.combo, this.maxCombo);
                }

                if (this.onScoreUpdate) {
                    this.onScoreUpdate(this.score, this.getAccuracy());
                }

                return {
                    result,
                    score: this.score,
                    combo: this.combo,
                    accuracy: this.getAccuracy()
                };
            }

            getAccuracy() {
                if (this.totalJudgments === 0) return 100;
                
                const weightedScore = 
                    (this.perfectCount * GameConstants.SCORES.PERFECT) +
                    (this.greatCount * GameConstants.SCORES.GREAT) +
                    (this.coolCount * GameConstants.SCORES.COOL);
                
                const maxPossibleScore = this.totalJudgments * GameConstants.SCORES.PERFECT;
                
                return Math.round((weightedScore / maxPossibleScore) * 100);
            }

            reset() {
                this.score = 0;
                this.combo = 0;
                this.maxCombo = 0;
                this.totalJudgments = 0;
                this.perfectCount = 0;
                this.greatCount = 0;
                this.coolCount = 0;
                this.missCount = 0;
            }

            getStats() {
                return {
                    score: this.score,
                    combo: this.combo,
                    maxCombo: this.maxCombo,
                    accuracy: this.getAccuracy(),
                    perfect: this.perfectCount,
                    great: this.greatCount,
                    cool: this.coolCount,
                    miss: this.missCount
                };
            }
        }

        // ============================================================
        // GAUGE ENGINE
        // ============================================================
        class GaugeEngine {
            constructor(timingEngine) {
                this.timingEngine = timingEngine;
                this.ballElement = null;
                this.perfectZoneElement = null;
            }

            setElements(ballElement, perfectZoneElement) {
                this.ballElement = ballElement;
                this.perfectZoneElement = perfectZoneElement;
                this.updatePerfectZoneMarker();
            }

            updatePerfectZoneMarker() {
                if (!this.perfectZoneElement) return;

                const windows = GameConstants.JUDGE_WINDOWS.PERFECT;
                const containerWidth = GameConstants.GAUGE_WIDTH;
                
                const leftPercent = windows.min * 100;
                const widthPercent = (windows.max - windows.min) * 100;

                this.perfectZoneElement.style.left = `${leftPercent}%`;
                this.perfectZoneElement.style.width = `${widthPercent}%`;
            }

            update() {
                if (!this.ballElement) return;

                const position = this.timingEngine.getGaugePosition();
                const containerWidth = GameConstants.GAUGE_WIDTH;
                const ballWidth = 16; // From CSS

                // Calculate pixel position
                const pixelPosition = position * (containerWidth - ballWidth) + (ballWidth / 2);

                this.ballElement.style.transform = `translateX(${pixelPosition - ballWidth / 2}px)`;
                this.ballElement.style.left = '0';
                this.ballElement.style.transform = `translateX(${position * containerWidth}px)`;

                return position;
            }

            getPosition() {
                return this.timingEngine.getGaugePosition();
            }
        }

        // ============================================================
        // AI PLAYER
        // ============================================================
        class AIPlayer {
            constructor(arrowEngine, judgeEngine, timingEngine, beatEngine) {
                this.arrowEngine = arrowEngine;
                this.judgeEngine = judgeEngine;
                this.timingEngine = timingEngine;
                this.beatEngine = beatEngine;
                this.enabled = false;
                this.lastActionTime = 0;
                this.actionDelay = 0.05; // 50ms delay for human-like timing
            }

            setEnabled(enabled) {
                this.enabled = enabled;
            }

            update() {
                if (!this.enabled || !this.timingEngine.isSongPlaying()) return;

                const currentTime = this.timingEngine.getCurrentTime();
                const progress = this.arrowEngine.getCurrentProgress();

                // Phase 1: Input arrow sequence
                if (!progress.isWaitingForSpace && !progress.isComplete) {
                    this.handleArrowInput(currentTime, progress);
                }
                // Phase 2: Press SPACE at correct timing
                else if (progress.isWaitingForSpace) {
                    this.handleSpaceInput(currentTime);
                }
            }

            handleArrowInput(currentTime, progress) {
                // Only act if enough time has passed since last action
                if (currentTime - this.lastActionTime < this.actionDelay) return;

                const pattern = this.arrowEngine.getCurrentPattern();
                if (!pattern || progress.current >= pattern.length) return;

                const expectedArrow = pattern[progress.current];
                
                // Simulate key press
                this.simulateArrowPress(expectedArrow);
                this.lastActionTime = currentTime;
            }

            handleSpaceInput(currentTime) {
                // Wait for perfect zone
                const position = this.timingEngine.getGaugePosition();
                const perfectZone = GameConstants.JUDGE_WINDOWS.PERFECT;

                // Press space when entering perfect zone
                if (position >= perfectZone.min && position <= perfectZone.max) {
                    if (currentTime - this.lastActionTime >= this.actionDelay) {
                        this.simulateSpacePress();
                        this.lastActionTime = currentTime;
                    }
                }
            }

            simulateArrowPress(direction) {
                // Use the same input handling as human player
                this.arrowEngine.handleArrowInput(direction);
            }

            simulateSpacePress() {
                // Use the same flow as human player
                this.arrowEngine.handleSpaceInput();
                this.judgeEngine.judgeSpacePress();
            }
        }

                // Keyboard input
                document.addEventListener('keydown', (e) => this.handleKeyDown(e));
                document.addEventListener('keyup', (e) => this.handleKeyUp(e));

                // AI toggle
                this.ui.aiPlayerToggle.addEventListener('change', (e) => {
                    this.aiPlayer.setEnabled(e.target.checked);
                });

                // BPM Correction
                this.ui.applyBpmBtn.addEventListener('click', () => this.applyManualBPM());
                this.ui.resetBpmBtn.addEventListener('click', () => this.resetBPM());
                this.ui.manualBpmInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.applyManualBPM();
                    }
                });
            }

            setupEngineCallbacks() {
                // Gauge Engine
                this.gaugeEngine.setElements(this.ui.beatGaugeBall, this.ui.perfectZoneMarker);

                // Arrow Engine callbacks
                this.arrowEngine.onPatternStart = (pattern) => {
                    this.renderArrowPattern(pattern);
                };

                this.arrowEngine.onArrowHit = (index, total) => {
                    this.highlightArrow(index - 1, 'hit');
                };

                this.arrowEngine.onArrowMiss = (pressed, expected) => {
                    this.flashAllArrows('miss');
                };

                this.arrowEngine.onSequenceComplete = () => {
                    this.ui.spaceIndicator.classList.add('ready');
                    this.ui.spaceIndicator.textContent = 'PRESS SPACE!';
                };

                this.arrowEngine.onReset = () => {
                    this.ui.spaceIndicator.classList.remove('ready');
                    this.ui.spaceIndicator.textContent = 'PRESS SPACE';
                    this.clearArrowHighlights();
                };

                // Judge Engine callbacks
                this.judgeEngine.onJudge = (result) => {
                    this.showJudgeText(result);
                };

                this.judgeEngine.onComboUpdate = (combo, maxCombo) => {
                    this.updateComboDisplay(combo, maxCombo);
                };

                this.judgeEngine.onScoreUpdate = (score, accuracy) => {
                    this.updateScoreDisplay(score, accuracy);
                };
            }

            async handleSongSelect(event) {
                const file = event.target.files[0];
                if (!file) return;

                this.setState(GameConstants.STATE.LOADING);
                this.ui.songInfo.classList.remove('hidden');
                this.ui.songNameDisplay.textContent = file.name;
                this.ui.songStatus.textContent = 'Loading...';
                this.ui.loadingProgress.style.width = '0%';

                try {
                    // Load audio file
                    await this.audioEngine.loadFile(file, (percent) => {
                        this.ui.loadingProgress.style.width = `${Math.min(percent, 90)}%`;
                    });

                    this.ui.songStatus.textContent = 'Analyzing beats...';
                    this.setState(GameConstants.STATE.ANALYZING);

                    // Detect beats
                    const { beats, bpm } = await this.beatDetector.detectBeats((percent) => {
                        this.ui.loadingProgress.style.width = `${90 + (percent * 0.1)}%`;
                    });

                    // Set beat data
                    this.beatEngine.setBeats(beats, bpm);

                    // Update UI
                    this.ui.songStatus.textContent = `Ready! ${beats.length} beats @ ${bpm.toFixed(2)} BPM`;
                    this.ui.loadingProgress.style.width = '100%';
                    this.ui.hudSongName.textContent = file.name.replace(/\.[^/.]+$/, '');
                    this.ui.hudBpm.textContent = bpm.toFixed(2);
                    
                    // Show BPM correction section
                    this.ui.bpmCorrectionSection.classList.remove('hidden');
                    this.ui.detectedBpmValue.textContent = bpm.toFixed(2);
                    this.ui.manualBpmInput.value = '';

                    this.setState(GameConstants.STATE.READY);
                    this.ui.startGameBtn.disabled = false;

                } catch (error) {
                    console.error('Error loading song:', error);
                    this.ui.songStatus.textContent = 'Error: ' + error.message;
                    this.setState(GameConstants.STATE.MENU);
                }
            }

            applyManualBPM() {
                const manualBpm = parseFloat(this.ui.manualBpmInput.value);
                
                if (isNaN(manualBpm) || manualBpm < 40 || manualBpm > 300) {
                    alert('Please enter a valid BPM between 40 and 300');
                    return;
                }

                const wasPlaying = this.state === GameConstants.STATE.PLAYING;
                
                // Stop audio if playing
                if (wasPlaying) {
                    const currentTime = this.audioEngine.getCurrentTime();
                    this.audioEngine.pause();
                    
                    // Store the current time to resume from same position
                    this.resumeTime = currentTime;
                }

                // Apply manual BPM
                this.beatEngine.enableManualBPM(manualBpm);
                
                // Update UI
                this.ui.hudBpm.textContent = manualBpm.toFixed(2) + ' (manual)';
                this.ui.dbgBpm.textContent = manualBpm.toFixed(2) + ' (manual)';

                // Resume if was playing
                if (wasPlaying && this.resumeTime !== undefined) {
                    setTimeout(() => {
                        this.audioEngine.seekTo(this.resumeTime);
                        this.audioEngine.play();
                    }, 100);
                }

                console.log(`BPM corrected to ${manualBpm.toFixed(2)}`);
            }

            resetBPM() {
                const wasPlaying = this.state === GameConstants.STATE.PLAYING;
                
                // Stop audio if playing
                if (wasPlaying) {
                    const currentTime = this.audioEngine.getCurrentTime();
                    this.audioEngine.pause();
                    
                    this.resumeTime = currentTime;
                }

                // Reset to detected BPM
                this.beatEngine.disableManualBPM();
                
                // Update UI
                this.ui.hudBpm.textContent = this.beatEngine.bpm.toFixed(2);
                this.ui.manualBpmInput.value = '';

                // Resume if was playing
                if (wasPlaying && this.resumeTime !== undefined) {
                    setTimeout(() => {
                        this.audioEngine.seekTo(this.resumeTime);
                        this.audioEngine.play();
                    }, 100);
                }

                console.log('BPM reset to detected value');
            }

            startGame() {
                if (!this.beatEngine.isReady()) {
                    console.error('Cannot start: Beat engine not ready');
                    return;
                }

                // Hide menu
                this.ui.menuOverlay.classList.add('hidden');

                // Reset game state
                this.judgeEngine.reset();
                this.arrowEngine.startNewPattern();
                
                // Clear arrow highlights
                this.clearArrowHighlights();
                this.ui.spaceIndicator.classList.remove('ready');
                this.ui.spaceIndicator.textContent = 'PRESS SPACE';

                // Start audio
                this.audioEngine.play();

                // Set AI if enabled
                this.aiPlayer.setEnabled(this.ui.aiPlayerToggle.checked);

                this.setState(GameConstants.STATE.PLAYING);
                
                // Start game loop
                this.lastFrameTime = performance.now();
                this.gameLoop();
            }

            gameLoop() {
                if (this.state !== GameConstants.STATE.PLAYING) return;

                // Update gauge
                this.gaugeEngine.update();

                // Update AI
                this.aiPlayer.update();

                // Update debug panel
                this.updateDebugPanel();

                // Update HUD beat counter
                const currentBeat = this.timingEngine.getCurrentBeat();
                if (currentBeat >= 0) {
                    this.ui.hudBeat.textContent = `${currentBeat + 1}/${this.beatEngine.getTotalBeats()}`;
                }

                // Check if song ended
                if (this.timingEngine.isSongEnded()) {
                    this.endGame();
                    return;
                }

                // Continue loop
                this.animationFrameId = requestAnimationFrame(() => this.gameLoop());
            }

            handleKeyDown(event) {
                if (this.state !== GameConstants.STATE.PLAYING) return;

                // Prevent default for game keys
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(event.code)) {
                    event.preventDefault();
                }

                // Handle arrow keys
                if (GameConstants.ARROW_KEYS[event.code]) {
                    const direction = GameConstants.ARROW_KEYS[event.code];
                    const result = this.arrowEngine.handleArrowInput(direction);
                    
                    if (result.result === 'HIT' || result.result === 'COMPLETE') {
                        // Visual feedback handled by callbacks
                    }
                }

                // Handle space
                if (event.code === 'Space') {
                    const result = this.arrowEngine.handleSpaceInput();
                    
                    if (result.result === 'SPACE_PRESSED') {
                        // Judge the timing
                        const judgment = this.judgeEngine.judgeSpacePress();
                        
                        // Start new pattern after judgment
                        setTimeout(() => {
                            this.arrowEngine.startNewPattern();
                            this.ui.spaceIndicator.classList.remove('ready');
                            this.ui.spaceIndicator.textContent = 'PRESS SPACE';
                            this.clearArrowHighlights();
                        }, 100);
                    }
                }
            }

            handleKeyUp(event) {
                // Handle key release if needed for visual effects
            }

            renderArrowPattern(pattern) {
                this.ui.arrowSlots.innerHTML = '';
                
                pattern.forEach((direction, index) => {
                    const slot = document.createElement('div');
                    slot.className = 'arrow-slot';
                    slot.dataset.index = index;
                    
                    const icon = document.createElement('span');
                    icon.className = 'arrow-icon';
                    icon.textContent = this.getArrowIcon(direction);
                    
                    slot.appendChild(icon);
                    this.ui.arrowSlots.appendChild(slot);
                });
            }

            getArrowIcon(direction) {
                const icons = {
                    'left': '←',
                    'up': '↑',
                    'down': '↓',
                    'right': '→'
                };
                return icons[direction] || '?';
            }

            highlightArrow(index, state) {
                const slots = this.ui.arrowSlots.querySelectorAll('.arrow-slot');
                if (slots[index]) {
                    slots[index].classList.add(state);
                }
            }

            flashAllArrows(state) {
                const slots = this.ui.arrowSlots.querySelectorAll('.arrow-slot');
                slots.forEach(slot => {
                    slot.classList.add(state);
                    setTimeout(() => slot.classList.remove(state), 200);
                });
            }

            clearArrowHighlights() {
                const slots = this.ui.arrowSlots.querySelectorAll('.arrow-slot');
                slots.forEach(slot => {
                    slot.classList.remove('hit', 'miss', 'active');
                });
            }

            showJudgeText(result) {
                this.ui.judgeText.textContent = result;
                this.ui.judgeText.className = `judge-text show ${result.toLowerCase()}`;
                
                // Reset animation
                setTimeout(() => {
                    this.ui.judgeText.classList.remove('show');
                }, 500);
            }

            updateComboDisplay(combo, maxCombo) {
                this.ui.comboDisplay.textContent = combo;
                
                if (combo > 0) {
                    this.ui.comboDisplayLarge.textContent = `${combo} COMBO`;
                    this.ui.comboDisplayLarge.classList.add('show');
                } else {
                    this.ui.comboDisplayLarge.classList.remove('show');
                }
            }

            updateScoreDisplay(score, accuracy) {
                this.ui.scoreDisplay.textContent = score.toLocaleString();
                this.ui.accuracyDisplay.textContent = `${accuracy}%`;
            }

            updateDebugPanel() {
                const effectiveBpm = this.beatEngine.getEffectiveBPM();
                this.ui.dbgTime.textContent = this.timingEngine.getCurrentTime().toFixed(3);
                this.ui.dbgBpm.textContent = effectiveBpm ? effectiveBpm.toFixed(2) + (this.beatEngine.bpmCorrectionEnabled ? ' (M)' : '') : '--';
                this.ui.dbgBeat.textContent = this.timingEngine.getCurrentBeat() + 1;
                this.ui.dbgMeasure.textContent = this.timingEngine.getCurrentMeasure() + 1;
                this.ui.dbgGauge.textContent = this.gaugeEngine.getPosition().toFixed(4);
                this.ui.dbgState.textContent = this.state;
                this.ui.dbgBeatCount.textContent = this.beatEngine.getTotalBeats();
            }

            setState(newState) {
                this.state = newState;
                console.log('Game state:', newState);
            }

            endGame() {
                this.setState(GameConstants.STATE.ENDED);
                
                if (this.animationFrameId) {
                    cancelAnimationFrame(this.animationFrameId);
                }

                this.audioEngine.stop();

                // Show final stats
                const stats = this.judgeEngine.getStats();
                alert(`Game Over!\n\nScore: ${stats.score}\nMax Combo: ${stats.maxCombo}\nAccuracy: ${stats.accuracy}%\n\nPerfect: ${stats.perfect}\nGreat: ${stats.great}\nCool: ${stats.cool}\nMiss: ${stats.miss}`);

                // Show menu again
                this.ui.menuOverlay.classList.remove('hidden');
                this.ui.startGameBtn.disabled = false;
                this.ui.songStatus.textContent = 'Ready to play!';
                this.setState(GameConstants.STATE.READY);
            }
        }

        // ============================================================
        // INITIALIZATION
        // ============================================================
        document.addEventListener('DOMContentLoaded', async () => {
            const game = new GameController();
            await game.init();
            
            // Expose for debugging
            window.game = game;
            
            console.log('🎵 Rhythm Game initialized');
            console.log('Load a song file to begin!');
        });
    </script>
</body>
</html>
